<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
  </head>
  <body
    style="font-family: Arial, sans-serif; color: #1a1a1a; background: #fbfbfd; padding: 32px 16px"
  >
    <main
      style="
        max-width: 480px;
        margin: auto;
        background: white;
        border: 1px solid #dde6f2;
        border-radius: 12px;
        padding: 28px;
      "
    >
      <p style="color: #277ee8; font-weight: 600">WatcheRobot</p>
      <h1 style="font-size: 22px">Verify your email / 验证邮箱 / メールを確認</h1>
      <p>Return to Watcher Desktop or the mobile app and enter this code:</p>
      <p>请回到桌面端或 App 输入以下验证码。アプリに戻り、次のコードを入力してください。</p>
      <p style="font-size: 32px; font-weight: 600; letter-spacing: 6px">{{ .Token }}</p>
      <p style="color: #526078; font-size: 13px">
        Do not share this code. If you did not request it, ignore this email.<br />请勿分享验证码；非本人操作请忽略。心当たりがなければ、このメールを無視してください。
      </p>
    </main>
  </body>
</html>
